## Reference genome file path
## Sarcophilus harrisii (Tasmanian devil) — mSarHar1.11, RefSeq GCF_902635505.1
## (TassieDev1/GCA_000005855.3 is no longer served by NCBI; mSarHar1.11 is the
## current RefSeq reference assembly.) Symlink in repo root -> /scratch/mike/sarcoph/mSarHar1.11_genome.fa
genome: sarcoph_genome.fa

## Sequence file path
## Tasmanian devil circRNA-seq SRA dump — PRJEB34650 (Sarcophilus harrisii, taxid 9305)
## 38 samples: 37 paired-end (_1/_2) + 1 single-end orphan (ERR3568649)
## Absolute path on purpose: snakemake resolves relative config paths against the
## CWD, and the run script cd's into the repo dir.
readDirectory: /scratch/mike/runs_bsj_finder/2026_tassie_devil_FASTQ

## Separate output tree so PRJEB58914 results in results/ are untouched.
## (Snakefile reads the 'outdir' key — the dead 'outputDirectory' key is not used.)
outdir: results_tassie_devil

# Excluded samples ────────────────────────────────────────────────────────
# Both fail a mapping-rate check against mSarHar1.11. Measured 2026-10-01 on 50k
# reads per sample: the other 36 sit at 96.3-99.1%, with one at 87.2%.
#
#   ERR3568437 (pancreas.2)   4.5% mapped -- 96% of its reads are not devil.
#       GC 51.7% vs ~41% for healthy samples; only 98 spliced reads in 500k
#       (vs 1,897-3,294 elsewhere), which is what first exposed it. Raising the
#       subsample 10x added ONE spliced read, so it is contamination, not sampling.
#   ERR3568649 (fibroblast.1) 29.9% mapped -- Illumina Genome Analyzer IIx, an
#       instrument from ~2010. Single-end, 36M reads, and genuinely UNSTRANDED
#       (500k reads gave 52,053 with ts:A, split 25,849/26,204 = 50.3%), since
#       non-directional protocols were standard in that era. Not comparable with
#       the HiSeq 4000 reverse-stranded libraries that make up the rest.
#
# Removing ERR3568649 also makes the set homogeneous: all 36 remaining samples are
# paired-end HiSeq 4000, and all 31 measured so far came out `reverse`.
# library_strandedness stays `auto` regardless -- a declared value would halt the
# whole run on one disagreeing sample, and `auto` still records every verdict in
# qc_results/ for audit, which is where the ERR3568649 finding came from.
exclude_samples:
  - ERR3568437
  - ERR3568649

# Read trimming (fastp) ────────────────────────────────────────────────────
# PRJEB34650 reads are FIXED-LENGTH 75 bp (37 PE samples); ERR3568649 (SE) is 100 bp.
# The former pipeline default of 90 exceeded the read length, so fastp discarded
# all 226M reads per sample ("failed due to too short") while still exiting 0 --
# every PE sample produced an empty FASTQ and the 2026-09-16 run's 18,561 junctions
# all came from ERR3568649 alone.
# 50 keeps the same ~60% of-read-length ratio the 150 bp GBM run uses (90/150),
# and leaves room for two >=12 bp back-splice arms (min_align_len) after --cut_tail.
fastp_min_len: 50

# Library strandedness ────────────────────────────────────────────────────
# reverse = R1 antisense (dUTP / TruSeq Stranded). The junction strand is flipped;
# without it every junction is reported on the wrong strand. Confirmed two ways on
# GBM sample 150: minimap2 ts:A splice-motif orientation (R1 96.2% antisense) and
# exonic reads vs GENCODE v44 gene strand (R1 97.2% antisense).
# Left as a literal rather than `auto` so it acts as an ASSERTION: detect_strandedness
# still runs per sample and the run FAILS if any sample disagrees.
# NB R2 is reverse-complemented for ALL paired samples regardless of this setting --
# see the LIBRARY STRANDEDNESS block in the Snakefile.
# 2026-09-30: `auto`, not `reverse`, because THIS DATASET IS MIXED. The 37 paired-end
# samples are reverse-stranded, but the single-end ERR3568649 is genuinely unstranded:
# 500k reads gave 52,053 with a ts:A tag, split +25,849 / -26,204 (50.3% antisense).
# That is a large, unambiguous measurement, not a weak signal. ERR3568649 is a separate
# single-end library from a different submission, so a different protocol is plausible.
#
# Declaring `reverse` made the run fail on that one sample, which is the assertion doing
# its job. `auto` lets each sample carry its own verdict -- detect_bsj_cor takes the
# per-sample verdict file as an input, so the mix is handled correctly.
#
# CAVEAT: for ERR3568649 the strand column is NOT meaningful, and +/- duplicate rows
# will persist for it (R1 orientation is random per fragment, so reverse-complementing
# R2 cannot collapse them). Affects 1 of 38 samples; see the Snakefile block.
library_strandedness: auto

# 2026-09-30: raised from the 50,000 default. ERR3568437 yielded only 97 spliced
# reads with a ts:A tag in the first 50k (below the 200 minimum) and halted the run,
# even though its direction was unambiguous (+1 / -96 = 99% antisense) and every
# other devil sample gave 1,897-3,294. The sample is healthy -- 193.6M reads passed
# fastp, comparable to its neighbours -- it simply has less linear splicing in the
# reads sampled.
#
# NB detect_strandedness reads the FIRST n reads, not a random sample, and the head
# of a FASTQ is one flowcell tile and so not representative. Raising n both increases
# the spliced yield and spreads the sample over more tiles. 500k gives ERR3568437
# roughly 970 spliced reads, well clear of the threshold.
strandedness_reads: 500000

# BSJ detection thresholds (Paf_parser.py) ─────────────────────────────────
# Deliberately 12, NOT the 20 used by the hg38/mm39 configs. Those raise it because a
# 12 bp arm matches a 3 Gb genome by chance, and mSarHar1.11 is 3.09 Gb -- but these
# reads are 75 bp, not 150. The median primary arm here is 42 bp (vs 89 bp for GBM), so
# a 20 bp floor on BOTH arms costs far more sensitivity than it does on longer reads.
# Measured: this dataset yields 0.27% junctions per SA record against GBM's 7.17%, and
# that is already WITH the lenient anchor.
min_align_len: 12
min_mapq: 1

# minimap2 seeding density ─────────────────────────────────────────────────
# mSarHar1.11 is 3.13 GB -- the same scale as hg38 -- so use the `sr` preset values,
# as config_gbm.yaml does. Without these keys this config silently inherited the
# benchmark defaults (11 / 5) from config/config.yaml: dense seeding tuned for a
# 1.5 Mb toy genome, which on a 3 Gb reference costs a lot of RAM and runtime
# (minimap2 rebuilds the index per job). The 2026-09-19 results were produced that
# way and are NOT comparable with the GBM run, which used 21 / 11.
preset: fast           # minimap2 -k 21 -w 11 (the `sr` values)

# SA-tag chimeric detector (sa_detect.py) — read-space arm gap/overlap tolerance
# read_suffix is NOT consumed anywhere in the pipeline (only referenced in
# commented-out code in extract_bsj_seq.smk/.py) — not carried over.
sa_max_read_gap: 20    # max unaligned gap between the two arms (read bp)
sa_max_read_ovlp: 20   # max arm overlap / microhomology (read bp)
# 2026-10-01: raised from 100000. 100 kb silently DROPS circles from long host genes,
# and the previous run showed the cap biting: 954 junctions (0.18%) had spans >90 kb,
# piled against the ceiling. Devil genes are comparable in span to human ones, so this
# matches the hg38/mm39 configs.
#
# NB an identical change was made on 2026-09-25 but was lost when the working tree was
# reverted by a `git checkout main` + fast-forward merge while the edits were still
# uncommitted. The 2026-10-01 run (501,227 junctions) therefore ran at 100000, not the
# 1000000 reported at the time.
max_gap_size: 1000000
bsj_flank: 50

# mmseqs2 binary: this host (Xeon E5-2690 v2) has no AVX2, so the bioconda
# mmseqs2 build dies with SIGILL ("Illegal instruction"). Use the vendored SSE4.1
# static binary in tools/mmseqs/ instead; the rules then attach no conda env.
# The pipeline default is false -- this is a property of the machine, not the data.
mmseqs_static: true

# Cross-sample junction identity ───────────────────────────────────────────
# Breakpoint slop (bp) within which two cluster members count as the SAME locus,
# used for the n_loci concordance check in the summary table. Microhomology wobble
# is typically <=10bp; genuine false merges (paralogs, shared-arm back-splices) are
# orders of magnitude larger, so 10 separates them cleanly.
bsj_locus_tol: 10

# MMseqs2 deduplication parameters ─────────────────────────────────────────
mmseqs_min_seq_id: 0.95
mmseqs_min_cov: 0.70
mmseqs_cov_mode: 0

# ── Polishing parameters (bcftools) ────────────────────────────────────────
polish_min_mapq: 20
polish_min_match: 75
bcftools_min_qual: 20
bcftools_min_dp: 3
sort_mem: "1G"
