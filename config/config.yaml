## Reference genome file path ─────────────────────────────────────────────
genome: test/genome.fasta.gz

## Sequence file path ─────────────────────────────────────────────────────
readDirectory: test/sample_reads_3
outputDirectory: output


# Read trimming (fastp) ────────────────────────────────────────────────────
# Minimum read length AFTER trimming; fastp discards anything shorter. Set this
# below the library's raw read length, with headroom for --cut_tail. If it is >=
# the read length fastp drops the ENTIRE library, exits 0, and writes valid but
# empty FASTQs that the rest of the pipeline happily consumes -- so check your
# read length before changing datasets.
fastp_min_len: 90

# Library strandedness ────────────────────────────────────────────────────
# auto = detect_strandedness measures it PER SAMPLE from the reads and the reference
# (ts:A splice-motif orientation of R1; no annotation needed) and refuses to guess if
# the signal is weak or ambiguous. Set a literal value instead to ASSERT one: the
# detection still runs and the run fails if the reads disagree.
library_strandedness: auto

# BSJ detection thresholds (Paf_parser.py) ─────────────────────────────────
min_align_len: 12
min_mapq: 1

# minimap2 seeding density ────────────────────────────────────────────────
# Dense seeding surfaces very short back-splice arms (needed on the small benchmark
# genome). For multi-Gb references set these to the `sr` preset values (21 / 11):
# the dense index is memory- and time-expensive and minimap2 rebuilds it per job.
minimap2_k: 11
minimap2_w: 5

# SA-tag chimeric detector (sa_detect.py) — read-space arm gap/overlap tolerance
sa_max_read_gap: 20    # max unaligned gap between the two arms (read bp)
sa_max_read_ovlp: 20   # max arm overlap / microhomology (read bp)
max_gap_size: 100000
bsj_flank: 50
read_suffix: "/1"

# mmseqs2 binary: conda env (false) or the vendored SSE4.1 static build (true).
# Leave false unless the host CPU lacks AVX2 -- the bioconda mmseqs2 package is
# AVX2-compiled and dies with SIGILL there. See the Snakefile for details.
mmseqs_static: false

# Gene annotation (GTF/GFF, .gz ok) ────────────────────────────────────────
# OPTIONAL, and used for exactly one thing: giving a junction a strand when the
# library is UNSTRANDED. Such a library sequences sense and antisense reads in
# equal measure, so a junction's aligned strand is a coin flip -- measured on the
# benchmark's pe150_lowerr_unstr library, the per-read split is 572 '+' to 595 '-'
# for junctions that are overwhelmingly '+'. The detector instead takes the strand
# of the single annotated gene CONTAINING both breakpoints, which does not depend
# on which mate was sequenced, and reports '.' when no single gene resolves it.
#
# Measured on that library (strand accuracy over the 47 true positives; recall and
# precision are identical either way, this only moves strand):
#   without annotation   correct 17  wrong 24  none 6   accuracy 0.362
#   with annotation      correct 40  wrong  1  none 6   accuracy 0.851
#
# KNOWN LIMITATION: an antisense circle -- one transcribed opposite to the gene it
# sits inside -- inherits that gene's strand and is called backwards. The host-gene
# assumption is wrong for exactly this class and the annotation cannot say so. The
# splice motif at the breakpoints can (it reads GT-AG on the circle's own strand),
# so a motif check is the natural way to close this gap.
#
# Ignored for forward/reverse libraries, whose strand the read already determines;
# leave unset for a genome that has no annotation.
# annotation: /path/to/genes.gtf

# Cross-sample junction identity ───────────────────────────────────────────
# Breakpoint slop (bp) within which two cluster members count as the SAME locus,
# used for the n_loci concordance check in the summary table. Microhomology wobble
# is typically <=10bp; genuine false merges (paralogs, shared-arm back-splices) are
# orders of magnitude larger, so 10 separates them cleanly.
bsj_locus_tol: 10

# Minimum concordant supporting reads for a junction to appear at all.
# 1 = report everything; raising it is an explicit per-dataset choice.
bsj_min_reads: 1

# Confidence tiering of the summary table ──────────────────────────────────
# Adds `mapq` (best supporting read's limiting-arm MAPQ) and `confidence`
# (high/medium/low) columns. Advisory only -- nothing is dropped; use
# bsj_min_reads for that. A junction is `high` if it clears BOTH high_ cuts,
# `medium` if it clears both med_ cuts, otherwise `low`.
#
# PROVISIONAL: these cuts were calibrated against the PRIMARY alignment MAPQ, but
# the column written is the LIMITING arm's (min of the two), which runs lower. The
# figures below are the design rationale, not measured performance of these values;
# recalibration from a GBM rerun with the new detector follows.
#
# Measured on GBM against the human circRNA databases:
#   high    9.1% of rows, 90.6% database-matched
#   medium  5.4% of rows, 70.4% matched
#   low    85.5% of rows, 14.7% matched
# Read support is the dominant axis; MAPQ is worth 20-30 points from 2 reads up
# but almost nothing at 1 read. Lower these for short-read libraries (e.g. 75bp),
# which do not reach the same per-junction depth.
bsj_high_min_reads: 3
bsj_high_min_mapq: 30
bsj_med_min_reads: 2
bsj_med_min_mapq: 10

# MMseqs2 deduplication parameters ─────────────────────────────────────────
mmseqs_min_seq_id: 0.95
mmseqs_min_cov: 0.70
mmseqs_cov_mode: 0

# ── Polishing parameters (bcftools) ──────────────────────────────────────────
polish_min_mapq: 20
polish_min_match: 75
bcftools_min_qual: 20
bcftools_min_dp: 3
sort_mem: "1G"


